name: CI Linux

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    # QApplication is constructed in CatchTests/main.cpp, so a headless
    # environment needs the offscreen QPA plugin. Set it at the job level
    # so every step (including configure / build) sees it.
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libqt6svg6-dev

      # -------------------------------------------------------------------
      # Install the Catch2 single-header.
      #
      # The test sources all use `#include <catch2/catch.hpp>`, and Linux
      # filesystems are case-sensitive, so:
      #   * the directory MUST be named `catch2` (lowercase), and
      #   * CATCH_INCLUDE_DIR MUST point at the PARENT of `catch2/`
      #     (i.e. the repo root), because the compiler forms the full path
      #     as  <CATCH_INCLUDE_DIR> + "/catch2/catch.hpp".
      #
      # Placing it at the repo root also works implicitly because
      # CatchTests/CMakeLists.txt already adds ${CMAKE_SOURCE_DIR} to the
      # include path; setting CATCH_INCLUDE_DIR makes it explicit.
      # -------------------------------------------------------------------
      - name: Install Catch2 single header
        run: |
          mkdir -p catch2
          curl -fL -o catch2/catch.hpp \
            https://github.com/catchorg/Catch2/releases/download/v2.13.10/catch.hpp
          echo "CATCH_INCLUDE_DIR=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Configure (CMake)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      # Ninja is a single-config generator; do NOT pass --config here.
      # CMAKE_BUILD_TYPE was already provided at configure time.
      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
